name: cron-open-play-reminder

# Expires unpaid Open Play signups past their payment window and sends
# T-2h "your Open Play session is in 2 hours" emails to confirmed players.
#
# Fires every 30 minutes so the detection window catches every session in
# exactly one run. reminder_sent_at idempotency prevents duplicates.
#
# Required repo secret: CRON_SECRET (must match the value set in Vercel env).
# Optional repo secret: CRON_TARGET_URL (defaults to https://dinkhub.ph).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-open-play-reminder
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/cron/open-play-reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          base="${CRON_TARGET_URL:-https://dinkhub.ph}"
          status=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -X POST "$base/api/cron/open-play-reminder" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            --max-time 120 --retry 2 --retry-delay 5)
          echo "status=$status"
          cat /tmp/body.json || true
          if [ "$status" != "200" ]; then
            echo "::error::cron-open-play-reminder returned non-200 status"
            exit 1
          fi
